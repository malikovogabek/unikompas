# Render Blueprint: New → Blueprint → select this repository.
# Secrets marked `sync: false` are entered once in the Render dashboard.
services:
  - type: web
    name: unikompas-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/regions
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true   # random Base64 secret generated by Render
      - key: ADMIN_EMAIL
        value: admin@unikompas.uz
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false           # e.g. https://unikompas.vercel.app
      - key: FLYWAY_LOCATIONS
        value: classpath:db/migration,classpath:db/demo
      - key: DEMO_USERS
        value: "true"
      - key: DEMO_PASSWORD
        value: Demo123!
