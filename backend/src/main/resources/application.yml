spring:
  application:
    name: unikompas-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/unikompas}
    username: ${DB_USERNAME:unikompas}
    password: ${DB_PASSWORD:unikompas}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

unikompas:
  jwt:
    # Base64-encoded HMAC key (>= 256 bit). MUST be overridden via JWT_SECRET outside local dev.
    secret: ${JWT_SECRET:}
    ttl: 24h
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  seed:
    demo-users: false
    demo-password: ${DEMO_PASSWORD:}
