# Keeps the free Render backend from sleeping (it spins down after 15 min without traffic and then
# needs ~1.5 min to start). Pings the database-free /api/v1/health endpoint, so the serverless
# Postgres (Neon) is not kept awake and its free compute hours are not consumed.
# Render free tier: ~730 h/month for one always-on service fits the 750 h allowance.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health
        run: |
          curl --fail --silent --show-error --max-time 180 --retry 3 --retry-delay 10 --retry-all-errors \
            https://unikompas-api.onrender.com/api/v1/health
